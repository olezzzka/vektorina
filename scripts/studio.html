<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vektorina · панель</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131926;
    --panel-2: #1a2130;
    --edge: #263043;
    --text: #eef2f8;
    --dim: #8b97ad;
    --gold: #f5b342;
    --green: #37e08a;
    --red: #ff5a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 "Segoe UI", Inter, system-ui, sans-serif;
    background-image:
      radial-gradient(700px 500px at 15% -5%, #2b6cff22, transparent 60%),
      radial-gradient(700px 500px at 90% 0%, #ff5a2b18, transparent 60%);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  header h1 { font-size: 30px; margin: 0; letter-spacing: -0.5px; }
  header span { color: var(--dim); font-size: 14px; }
  .sub { color: var(--dim); margin: 0 0 26px; font-size: 14px; }

  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 20px;
  }
  .card h2 { margin: 0 0 16px; font-size: 15px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); }

  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  select, input[type=number] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--edge); border-radius: 10px; padding: 11px 12px; font: inherit;
  }
  select:focus, input:focus { outline: 2px solid var(--gold); outline-offset: -1px; }

  .toggles { display: grid; gap: 10px; margin: 4px 0 18px; }
  .toggle {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--edge); border-radius: 10px; cursor: pointer;
  }
  .toggle input { accent-color: var(--gold); width: 17px; height: 17px; }
  .toggle small { color: var(--dim); display: block; font-size: 12px; }

  button {
    font: 600 15px/1 inherit; border-radius: 11px; border: 1px solid transparent;
    padding: 13px 16px; cursor: pointer; transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .primary { background: var(--gold); color: #1a1205; width: 100%; }
  .ghost { background: var(--panel-2); color: var(--text); border-color: var(--edge); }
  .danger { background: transparent; color: var(--red); border-color: #4a2630; width: 100%; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--edge); color: var(--dim);
  }
  .chip b { color: var(--text); font-weight: 600; }

  #log {
    background: #080b11; border: 1px solid var(--edge); border-radius: 12px;
    height: 260px; overflow: auto; padding: 14px 16px; margin-top: 4px;
    font: 12.5px/1.65 ui-monospace, Consolas, monospace; color: #c3ccdb; white-space: pre-wrap;
  }
  #log .warn { color: var(--gold); }
  #log .ok { color: var(--green); }
  #log:empty::after { content: "лог появится, когда запустишь сборку"; color: #4d586b; }

  .status { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3d4759; }
  .dot.run { background: var(--gold); animation: pulse 1.1s infinite; }
  .dot.ok { background: var(--green); }
  @keyframes pulse { 50% { opacity: .3; } }

  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin-top: 4px; }
  .vid { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; }
  .vid img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #0a0d13; cursor: pointer; }
  .vid .meta { padding: 11px 12px 13px; }
  .vid .name { font-size: 12.5px; color: var(--dim); word-break: break-all; }
  .vid .row { display: flex; gap: 7px; margin-top: 9px; }
  .vid .row button { flex: 1; padding: 8px; font-size: 12px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: #22293a; color: var(--gold); font-weight: 600; margin-bottom: 6px;
  }
  .empty { color: var(--dim); padding: 26px 0; }

  dialog {
    border: 1px solid var(--edge); background: var(--panel); color: var(--text);
    border-radius: 16px; padding: 0; max-width: 560px; width: 92vw;
  }
  dialog::backdrop { background: #000c; }
  dialog .head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--edge); }
  dialog h3 { margin: 0; font-size: 16px; }
  dialog pre { margin: 0; padding: 20px; max-height: 55vh; overflow: auto; white-space: pre-wrap; font: 13px/1.7 ui-monospace, Consolas, monospace; }
  dialog .foot { padding: 14px 20px; border-top: 1px solid var(--edge); display: flex; gap: 10px; }
  video { width: 100%; display: block; background: #000; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vektorina</h1>
    <span>панель управления</span>
  </header>
  <p class="sub">Собирает ролики целиком: цены → викторина → фон → озвучка → рендер → баннер.</p>

  <div class="grid">
    <div class="card">
      <h2>Новая сборка</h2>

      <label class="field">
        <span>Формат</span>
        <select id="format">
          <option value="duel">Что дороже — два скина</option>
          <option value="price">Угадай цену — один скин, три варианта</option>
          <option value="odd">Лишний по цене — три скина</option>
          <option value="spot">Где это — калауты на карте</option>
          <option value="random">Случайный на каждый ролик</option>
        </select>
      </label>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label class="field">
          <span>Сколько роликов</span>
          <input id="count" type="number" min="1" max="20" value="1">
        </label>
        <label class="field">
          <span>Раундов в ролике</span>
          <input id="rounds" type="number" min="3" max="12" placeholder="7">
        </label>
      </div>

      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="data">
          <div>Обновить цены<small>+1–2 минуты, нужно раз в день</small></div></label>
        <label class="toggle"><input type="checkbox" id="voice" checked>
          <div>Озвучка<small>голос читает реплики</small></div></label>
        <label class="toggle"><input type="checkbox" id="bg" checked>
          <div>Видео-фон<small>размытый геймплей</small></div></label>
        <label class="toggle"><input type="checkbox" id="ad" checked>
          <div>Баннер в середине<small>реклама поверх стоп-кадра</small></div></label>
      </div>

      <button class="primary" id="run">Собрать</button>
      <div style="height:10px"></div>
      <button class="danger" id="stop" disabled>Остановить</button>

      <div class="chips" id="chips"></div>
    </div>

    <div>
      <div class="card">
        <h2>Ход сборки</h2>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">ожидание</span></div>
        <div id="log"></div>
      </div>

      <div class="card" style="margin-top:20px">
        <h2>Готовые ролики</h2>
        <div class="videos" id="videos"></div>
      </div>
    </div>
  </div>
</div>

<dialog id="modal">
  <div class="head"><h3 id="modalTitle">—</h3><button class="ghost" onclick="modal.close()">Закрыть</button></div>
  <div id="modalBody"></div>
  <div class="foot" id="modalFoot"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');

function addLine(line) {
  const div = document.createElement('div');
  if (line.startsWith('!')) div.className = 'warn';
  else if (line.includes('готово') || line.includes('всё готово')) div.className = 'ok';
  div.textContent = line;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function setRunning(run) {
  $('run').disabled = run;
  $('stop').disabled = !run;
  $('dot').className = 'dot' + (run ? ' run' : '');
  $('statusText').textContent = run ? 'идёт сборка…' : 'ожидание';
}

async function refresh() {
  const s = await (await fetch('/api/state')).json();
  const c = s.config;
  $('chips').innerHTML = [
    ['голос', c.voice ? c.voice + ' · ' + c.engine : 'выключен'],
    ['музыка', c.music ? 'есть' : 'нет'],
    ['баннер', c.ad ? 'есть' : 'нет'],
    ['фон', c.background ? 'видео' : 'градиент'],
  ].map(([k, v]) => '<span class="chip">' + k + ': <b>' + v + '</b></span>').join('');

  $('videos').innerHTML = s.videos.length
    ? s.videos.map((v) => {
        const mb = (v.size / 1048576).toFixed(1);
        return '<div class="vid">' +
          '<img loading="lazy" src="/poster/' + encodeURIComponent(v.id) + '.jpg" onclick="play(\'' + v.id + '\')">' +
          '<div class="meta"><span class="badge">' + v.format + ' · ' + v.rounds + '</span>' +
          '<div class="name">' + v.id + '</div>' +
          '<div class="name">' + mb + ' МБ' + (v.hasVoice ? ' · с голосом' : '') + '</div>' +
          '<div class="row">' +
            '<button class="ghost" onclick="showText(\'caption\',\'' + v.id + '\')">Пост</button>' +
            '<button class="ghost" onclick="showText(\'script\',\'' + v.id + '\')">Сценарий</button>' +
          '</div></div></div>';
      }).join('')
    : '<div class="empty">Пока пусто — собери первый ролик.</div>';

  setRunning(s.running);
  if (!logEl.childElementCount && s.lines.length) s.lines.forEach(addLine);
}

function play(id) {
  $('modalTitle').textContent = id;
  $('modalBody').innerHTML = '<video controls autoplay src="/video/' + encodeURIComponent(id) + '.mp4"></video>';
  $('modalFoot').innerHTML = '';
  modal.showModal();
}

async function showText(kind, id) {
  const r = await (await fetch('/api/text/' + kind + '/' + encodeURIComponent(id))).json();
  $('modalTitle').textContent = kind === 'caption' ? 'Текст поста' : 'Сценарий озвучки';
  $('modalBody').innerHTML = '<pre id="txt"></pre>';
  $('txt').textContent = r.text;
  $('modalFoot').innerHTML = '<button class="primary" style="width:auto" id="copy">Скопировать</button>';
  $('copy').onclick = () => {
    navigator.clipboard.writeText(r.text);
    $('copy').textContent = 'Скопировано';
  };
  modal.showModal();
}

$('run').onclick = async () => {
  logEl.innerHTML = '';
  setRunning(true);
  await fetch('/api/build', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({
      format: $('format').value,
      count: Number($('count').value) || 1,
      rounds: Number($('rounds').value) || 0,
      data: $('data').checked,
      voice: $('voice').checked,
      bg: $('bg').checked,
      ad: $('ad').checked,
    }),
  });
};

$('stop').onclick = () => fetch('/api/stop', {method: 'POST'});

const es = new EventSource('/api/logs');
es.addEventListener('log', (e) => {
  // сборку могли запустить и мимо панели (из терминала) — тогда узнаём о ней по логу
  if (!$('run').disabled) setRunning(true);
  addLine(JSON.parse(e.data));
});
es.addEventListener('done', (e) => {
  const code = JSON.parse(e.data).code;
  addLine(code === 0 ? '— сборка завершена —' : '— остановлено (код ' + code + ') —');
  setRunning(false);
  refresh();
});

refresh();
setInterval(() => { if ($('run').disabled) refresh(); }, 15000);
</script>
</body>
</html>
